name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: CycloneDX SBOM (runtime deps only)
        run: |
          uv export --locked --no-dev --no-hashes --format requirements-txt -o requirements.txt
          uv run cyclonedx-py requirements --of JSON -o sbom.cdx.json requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
