name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: deploy

jobs:
  modal:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: modal deploy (skipped until MODAL_TOKEN_ID/SECRET repo secrets exist)
        if: ${{ env.MODAL_TOKEN_ID != '' }}
        run: uv run modal deploy modal_app.py
