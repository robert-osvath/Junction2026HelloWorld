[project]
name = "trusted-trade-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    "python-dotenv",
    "pymysql>=1.2.4",
]

[dependency-groups]
dev = [
    "cyclonedx-bom>=8.0.1",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
